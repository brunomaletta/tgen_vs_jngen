# Maps comparison-table operations to source locations.
# tgen: Doxygen qualified name (resolved via vendor/tgen/docs/build/xml).
# jngen: implementation file + line (pinned to vendor submodule SHA at render time).

repos:
  tgen: brunomaletta/tgen
  jngen: ifsmirnov/jngen

