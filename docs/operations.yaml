# Source of truth for the feature comparison table.
# Regenerate docs with: python3 docs/render_docs.py

categories:
  graphs: Graphs
  trees: Trees
  lists: Lists and sequences
  math: Math
  geometry: Geometry
  strings: Strings
  hacks: Hacks
  other: Other

operations:
  # --- Graphs (benchmarked head-to-head) ---
  - id: graph_connected
    name: Connected random graph
    category: graphs
    tgen:
      has: true
      api: "graph(n, m).get_connected()"
      uniform: non-uniform
      complexity: "O(n + m log^2 n) expected"
    jngen:
      has: true
      api: "Graph::random(n, m).connected()"
      uniform: non-uniform (inferred)
      complexity: "O(n + m log n) (inferred)"
    notes: "Same Prüfer tree + rejection edge add. Neither uniform over all connected labeled graphs."
    benchmark: true
    benchmark_id: graph_connected_m_eq_n

  - id: graph_gen
    name: Random graph with fixed n, m
    category: graphs
    tgen:
      has: true
      api: "graph(n, m).gen()"
      uniform: uniform
      complexity: "O(n + m log^2 n) expected"
    jngen:
      has: true
      api: "Graph::random(n, m)"
      uniform: non-uniform (inferred)
      complexity: "O(n + m log n) (inferred)"
    notes: "Rejection sampling with constraint machinery."
    benchmark: true
    benchmark_id: graph_gen
    secondary_benchmark_ids:
      - graph_gen_m_eq_2n

  - id: graph_gen_skewed
    name: Skewed / stretched connected graph
    category: graphs
    tgen:
      has: true
      api: "graph::gen_skewed(n, m, elongation, spread)"
      uniform: non-uniform
      complexity: "O(n + m log n) if spread is O(1); O(n log n + m log^2 n) expected otherwise"
    jngen:
      has: true
      api: "Graph::randomStretched(n, m, elongation, spread)"
      uniform: non-uniform
      complexity: "O(n + m log n) (inferred) if spread is O(1); Omega(n * m) (inferred) otherwise"
    notes: "Same high-level algorithm: skewed spanning tree, then ancestor-biased extra edges. Extra edges reject duplicates; jngen resets an attempt counter on success and throws after MAX_ATTEMPTS=1000 consecutive failures, while tgen uses its unique generation framework. For large spread, tgen uses binary lifting; jngen uses trivial parent-by-parent lifting."
    benchmark: true
    benchmark_id: graph_gen_skewed_m_eq_n
    secondary_benchmark_ids:
      - graph_gen_skewed_distinct_worst

  - id: graph_bipartite
    name: Bipartite graph (random / complete)
    category: graphs
    tgen:
      has: true
      api: "graph::gen_bipartite(n1, n2, m), K(n1, n2)"
      uniform: uniform
      complexity: "O(n1 + n2 + m log(n1 * n2)) expected"
    jngen:
      has: true
      api: "Graph::randomBipartite(n1, n2, m), completeBipartite(n1, n2)"
      uniform: uniform (inferred)
      complexity: "O(n1 + n2 + m log(n1 * n2)) (inferred)"
    notes: "tgen: distinct edge-index sampling. jngen: rejection sampling. Both support optional connected generation. jngen also supports allowMulti; tgen stores simple graphs only."
    benchmark: true
    benchmark_id: graph_bipartite

  - id: graph_directed
    name: Directed random graph
    category: graphs
    tgen:
      has: true
      api: "graph(n, m, directed=true).gen()"
      uniform: non-uniform
      complexity: "O(n + m log^2 n) expected"
    jngen:
      has: true
      api: "Graph::random(n, m).directed().g()"
      uniform: non-uniform (inferred)
      complexity: "O(n + m log n) (inferred)"
    notes: "tgen: rejection with constraint machinery. jngen: rejection sampling."
    benchmark: true
    benchmark_id: graph_directed
    secondary_benchmark_ids:
      - graph_directed_acyclic

  - id: graph_directed_acyclic
    name: Directed acyclic random graph (DAG)
    category: graphs
    tgen:
      has: true
      api: "graph(n, m, directed=true).get_acyclic()"
      uniform: non-uniform
      complexity: "O(n + m log^2 n) expected"
    jngen:
      has: true
      api: "Graph::random(n, m).directed().acyclic().g()"
      uniform: non-uniform (inferred)
      complexity: "O(n + m log n) (inferred)"
    notes: "tgen: randomized Kahn topological order, then rejection sampling. jngen: rejection sampling + acyclic shuffle-orient."
    benchmark: false
    benchmark_id: graph_directed_acyclic

  # --- Trees (benchmarked head-to-head) ---
  - id: tree_gen
    name: Random labeled tree
    category: trees
    tgen:
      has: true
      api: "tree(n).gen()"
      uniform: uniform
      complexity: "O(n)"
    jngen:
      has: true
      api: "Tree::random(n)"
      uniform: uniform
      complexity: "O(n) (inferred)"
    notes: "Prüfer sequence."
    benchmark: true
    benchmark_id: tree_gen

  - id: tree_gen_skewed
    name: Skewed tree (wnext / Prim-like)
    category: trees
    tgen:
      has: true
      api: "tree::gen_skewed(n, elongation)"
      uniform: non-uniform
      complexity: "O(n)"
    jngen:
      has: true
      api: "Tree::randomPrim(n, elongation)"
      uniform: non-uniform (inferred)
      complexity: "O(n) (inferred)"
    notes: "Uses parent(i) = wnext(i, elongation)."
    benchmark: true
    benchmark_id: tree_gen_skewed

  - id: tree_kruskal
    name: Random tree (Kruskal-like)
    category: trees
    tgen:
      has: true
      api: "tree::gen_kruskal(n)"
      uniform: non-uniform
      complexity: "O(n log(n) alpha(n)) expected"
    jngen:
      has: true
      api: "Tree::randomKruskal(n)"
      uniform: non-uniform (inferred)
      complexity: "O(n log(n) alpha(n)) expected (inferred)"
    notes: "Kruskal-like edge add until connected."
    benchmark: true
    benchmark_id: tree_gen_kruskal

  # --- Lists and sequences ---
  - id: list_all_different
    name: Distinct values in range
    category: lists
    tgen:
      has: true
      api: "list<int>(k, lo, hi).all_different().gen()"
      uniform: uniform
      complexity: "O(k log k)"
    jngen:
      has: true
      api: "Array::randomUnique(k, lo, hi)"
      uniform: uniform (inferred)
      complexity: "O(k log k) expected (inferred)"
    notes: "tgen: Fisher–Yates + forbidden-value map. jngen: hash-set rejection."
    benchmark: true
    benchmark_id: list_all_different

  - id: list_random
    name: Random integer list (duplicates allowed)
    category: lists
    tgen:
      has: true
      api: "list<int>(k, lo, hi).gen()"
      uniform: uniform
      complexity: "O(k)"
    jngen:
      has: true
      api: "Array::random(k, lo, hi)"
      uniform: uniform (inferred)
      complexity: "O(k) (inferred)"
    notes: "Independent uniform draws."
    benchmark: true
    benchmark_id: list_random

  - id: permutation_uniform
    name: Uniform random permutation
    category: lists
    tgen:
      has: true
      api: "permutation(n).gen()"
      uniform: uniform
      complexity: "O(n)"
    jngen:
      has: true
      api: "Array::id(n).shuffled()"
      uniform: uniform (inferred)
      complexity: "O(n) (inferred)"
    benchmark: true
    benchmark_id: permutation_uniform

  - id: declarative_generators
    name: Declarative constraints (palindrome, cycles)
    category: lists
    tgen:
      has: true
      api: "list/str/permutation/pair with .palindrome(), .cycles()..."
      uniform: ""
      complexity: ""
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Constraint-based uniform sampling."

  # --- Math ---
  - id: math_partition_fixed_size_fast
    name: Partition into k parts (fast)
    category: math
    tgen:
      has: true
      api: "math::gen_partition_fixed_size_fast(n, k, part_left, part_right)"
      uniform: non-uniform
      complexity: "O(k log k)"
    jngen:
      has: true
      api: "rndm.partition(n, numParts, minSize, maxSize)"
      uniform: non-uniform (inferred)
      complexity: "O(k log k) (inferred)"
    notes: "Same high-level approach: random delimiters, sort, gap recovery. jngen also sorts parts in non-increasing order and shuffles; tgen fast omits reordering. Not uniformly random; optimized for speed."
    benchmark: true
    benchmark_id: math_partition_fixed_size_fast

  - id: math_partition_fixed_size
    name: Uniform ordered partition into k parts (composition)
    category: math
    tgen:
      has: true
      api: "math::gen_partition_fixed_size(n, k, part_left, part_right)"
      uniform: uniform
      complexity: "O(n) if unbounded part_right; O(n·k) otherwise"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Stars-and-bars or DP in log space. Uniform over ordered compositions."
    benchmark: true
    benchmark_id: math_partition_fixed_size

  - id: math_partition
    name: Uniform ordered partition, variable number of parts
    category: math
    tgen:
      has: true
      api: "math::gen_partition(n, part_left, part_right)"
      uniform: uniform
      complexity: "O(n)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "DP in log space."
    benchmark: true
    benchmark_id: math_partition

  - id: math_congruent
    name: Random integer with congruence constraints
    category: math
    tgen:
      has: true
      api: "math::gen_congruent(l, r, rems, mods)"
      uniform: uniform
      complexity: "O(|mods| + log r)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: math_partition_array
    name: Partition array into k groups
    category: math
    tgen:
      has: true
      api: "math::partition_elements(elements, k, min_size, max_size)"
      uniform: "uniform if unbounded max_size; non-uniform otherwise"
      complexity: "O(n) if unbounded max_size; O(n + k log k) otherwise"
    jngen:
      has: true
      api: "rndm.partition(elements, numParts, minSize, maxSize)"
      uniform: non-uniform (inferred)
      complexity: "O(n + k log k) (inferred)"
    benchmark: true
    benchmark_id: math_partition_array

  # --- Geometry ---
  - id: geometry_convex_polygon
    name: Random convex polygon (non strict)
    category: geometry
    tgen:
      has: true
      api: "geometry::random_convex_polygon(n, min, max, strict=false)"
      uniform: non-uniform
      complexity: "O(n log n)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Valtr lattice walk; collinear boundary vertices allowed."
    benchmark: true
    benchmark_id: geometry_convex_polygon
    visualize: true
    gallery_stack:
      - geometry_convex_polygon
      - geometry_convex_polygon_large
    gallery_stack_top_params: "n=80, min=0, max=1000"
    gallery_stack_params: "n=15000, min=0, max=3e9"

  - id: geometry_convex_polygon_strict
    name: Random convex polygon (strict)
    category: geometry
    tgen:
      has: true
      api: "geometry::random_convex_polygon(n, min, max, strict=true)"
      uniform: non-uniform
      complexity: "O(n log n)"
    jngen:
      has: true
      api: "rndg.convexPolygon(n, min, max)"
      uniform: non-uniform (inferred)
      complexity: "O(n log n) (inferred)"
    notes: "Both sample extra vertices then subsample to n: jngen hull of 10n ellipse points; tgen Valtr walk on n + max(100, n/1000) grid lines, collinear removal, subsample."
    benchmark: true
    benchmark_id: geometry_convex_polygon_strict

  - id: geometry_convex_polygon_large
    name: Random convex polygon (large)
    category: geometry
    gallery_only: true
    tgen:
      has: true
      api: "geometry::random_convex_polygon(n, min, max, strict=false)"
      uniform: ""
      complexity: ""
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    visualize: true
    gallery_params: "n=15000, min=0, max=3e9"

  - id: geometry_points_general_position
    name: Points in general position (no three collinear)
    category: geometry
    tgen:
      has: true
      api: "geometry::random_points_general_position(n, min, max)"
      uniform: non-uniform
      complexity: "O(n)"
    jngen:
      has: true
      api: "rndg.pointsInGeneralPosition(n, min, max)"
      uniform: non-uniform (inferred)
      complexity: "O(n² log n) expected (inferred)"
    notes: "tgen: algebraic construction over F_p. jngen: rejection until no collinearity."
    benchmark: true
    benchmark_id: geometry_points_general_position_small
    secondary_benchmark_ids:
      - geometry_points_general_position
    visualize: true
    gallery_params: "n=2000, min=0, max=3e6"

  - id: geometry_simple_polygon
    name: Random simple polygon
    category: geometry
    tgen:
      has: true
      api: "geometry::random_simple_polygon(n, min, max, strict=false)"
      uniform: non-uniform
      complexity: "O(n log n) expected"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Default (strict=false) samples distinct grid points, then polygonizes; strict=true uses general-position vertices (v1.0.0 behavior). Collinear triples may appear on the boundary when strict=false."
    benchmark: false
    benchmark_id: geometry_random_simple_polygon
    visualize: true
    gallery_params: "n=80, min=0, max=1000"

  - id: geometry_simple_polygon_through_points
    name: Simple polygon through given points
    category: geometry
    tgen:
      has: true
      api: "geometry::random_simple_polygon_through_points(pts)"
      uniform: non-uniform
      complexity: "O(n log n) expected"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Randomized divide-and-conquer Hamiltonian path."
    benchmark: false
    benchmark_id: geometry_simple_polygon_through_points
    visualize: true
    gallery_params: "10×10 input grid, min=0, max=1000"

  - id: distinct_generation
    name: Distinct generation
    category: other
    tgen:
      has: true
      api: "tgen::distinct<Func, Args>"
      uniform: uniform
      complexity: "O(T log k + log^2 k) amortized expected per call when generating k values and next() runs in O(T)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Composable constraint machinery."
    exclusive: tgen

  - id: testlib_integration
    name: Testlib integration
    category: other
    tgen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    jngen:
      has: true
      api: "registerGen, global rnd/rndm/rndg, testlib-compatible patterns"
      uniform: ""
      complexity: ""
    notes: "jngen is built on testlib. tgen is a standalone header with register_gen and its own constraint API."
    exclusive: jngen

  - id: geometry_svg_drawer
    name: Built-in SVG visualization
    category: other
    tgen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    jngen:
      has: true
      api: "Drawer d; d.polygon(...); d.dumpSvg(\"out.svg\")"
      uniform: ""
      complexity: ""
    notes: "jngen Drawer for points, segments, circles, polygons; outputs SVG."

  - id: library_build_accel
    name: Accelerated build guide
    category: other
    tgen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    jngen:
      has: true
      api: "JNGEN_DECLARE_ONLY (precompiled static library)"
      uniform: ""
      complexity: ""
    notes: "Compile jngen.h once into a static lib; link with JNGEN_DECLARE_ONLY for faster rebuilds."
    exclusive: jngen

  # --- Strings ---
  - id: str_regex
    name: Regex / pattern strings
    category: strings
    tgen:
      has: true
      api: 'str("(([1-9][0-9]{3}|[A-F]{4})|(ab|cd){2}){r}").gen()'
      uniform: uniform
      complexity: "O(output length) expected."
    jngen:
      has: true
      api: 'rnds.random("(([1-9][0-9]{3}|[A-F]{4})|(ab|cd){2}){r}")'
      uniform: non-uniform
      complexity: "O(output length) (inferred)"
    notes: "Same testlib-style regex syntax. tgen samples uniformly among matches (documented); jngen explicitly does not: e.g. rnd.next(\"[1-9][0-9]{1,2}\") does not yield uniform digit strings. Benchmark measures generation throughput at fixed pattern length, not distributional fairness."
    benchmark: true
    benchmark_id: str_regex

  # --- Hacks (hack::) ---
  - id: anti_hash_strings
    name: Polynomial hash collision strings (signed mod)
    category: hacks
    tgen:
      has: true
      api: "hack::polynomial_hash(alphabet, base, mod)"
      uniform: ""
      complexity: "O(√mod log mod)"
    jngen:
      has: true
      api: "rnds.antiHash({{mod, base}, ...}, alphabet, len)"
      uniform: ""
      complexity: "O(√mod log mod) (inferred)"
    notes: "Deterministic collision construction, not random sampling. Both generate colliding strings for rolling hash."

  - id: hack_unsigned_polynomial_hash
    name: Polynomial hash collision (unsigned / power-of-two mod)
    category: hacks
    tgen:
      has: true
      api: "hack::unsigned_polynomial_hash()"
      uniform: ""
      complexity: "O(1)"
    notes: "Thue–Morse construction."
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: anti_unordered_set
    name: std::unordered_set collision inputs
    category: hacks
    tgen:
      has: true
      api: "hack::std_unordered(size)"
      uniform: ""
      complexity: "O(n)"
    jngen:
      has: true
      api: "rnda.antiUnorderedSet(n, maxLoadFactor, reserve)"
      uniform: ""
      complexity: "O(n) (inferred)"
    notes: "Overlap in purpose; different APIs and compiler support. jngen: GCC 4.x only; tuned load factor/reserve. tgen: GCC multiplier-based collision keys."

  - id: hack_string_set
    name: std::set collision strings
    category: hacks
    tgen:
      has: true
      api: "hack::string_set_worst_case(size)"
      uniform: ""
      complexity: "O(size log size)"
    notes: "Distinct strings with equal std::set ordering keys."
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_dinitz
    name: Max-flow worst case (Dinitz / Edmonds-Karp)
    category: hacks
    tgen:
      has: true
      api: "hack::dinitz_worst_case(k, l)"
      uniform: ""
      complexity: "O(l + k²)"
    notes: "Zadeh network."
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_mo
    name: Mo's algorithm worst-case queries
    category: hacks
    tgen:
      has: true
      api: "hack::mo_worst_case(n, q)"
      uniform: ""
      complexity: "O(n log n + q)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_spfa
    name: SPFA TLE graph
    category: hacks
    tgen:
      has: true
      api: "hack::spfa(n)"
      uniform: ""
      complexity: "O(n)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Graph with n vertices and edges; forces Ω(n²) relaxations."

  - id: hack_stale_heap_dijkstra
    name: Stale-heap Dijkstra bug graph
    category: hacks
    tgen:
      has: true
      api: "hack::stale_heap_dijkstra_bug(n)"
      uniform: ""
      complexity: "O(n)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Forces Ω(n²) without stale-heap skip."

  - id: hack_non_strict_dijkstra
    name: Non-strict relaxation Dijkstra bug graph
    category: hacks
    tgen:
      has: true
      api: "hack::non_strict_relaxation_dijkstra_bug(n)"
      uniform: ""
      complexity: "O(n)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Forces Ω(2^{n/2}) with non-strict relaxation."

  - id: hack_mt19937_xor_hash
    name: MT19937 XOR-hash collision mask
    category: hacks
    tgen:
      has: true
      api: "hack::mt19937_xor_hash<T>()"
      uniform: ""
      complexity: "O(1)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Bitmask for int or long long outputs."

  - id: hack_segment_tree_beats
    name: Segment-tree-beats worst case
    category: hacks
    tgen:
      has: true
      api: "hack::segment_tree_beats_worst_case(k, q)"
      uniform: ""
      complexity: "O(n + q)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_rotating_calipers
    name: Rotating calipers bug polygon
    category: hacks
    tgen:
      has: true
      api: "hack::naive_rotating_calipers_max_dist_bug()"
      uniform: ""
      complexity: "O(1)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "Fixed 6-vertex convex polygon."
