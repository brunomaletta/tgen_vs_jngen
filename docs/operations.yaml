# Source of truth for the feature comparison table.
# Regenerate docs with: python3 docs/render_docs.py

categories:
  graphs: Graphs
  trees: Trees
  lists: Lists and sequences
  math: Math
  geometry: Geometry
  strings: Strings and hashing
  adversarial: Adversarial / hack generators
  other: Other

operations:
  # --- Graphs (benchmarked head-to-head) ---
  - id: graph_connected
    name: Connected random graph
    category: graphs
    tgen:
      has: true
      api: "graph(n, m).get_connected()"
      uniform: non-uniform
      complexity: "O(n + m log n); Prüfer spanning tree + rejection edge add"
    jngen:
      has: true
      api: "Graph::random(n, m).connected()"
      uniform: non-uniform
      complexity: "O(n + m) expected (inferred); Prüfer spanning tree + rejection edge add"
    notes: "Same Prüfer tree + rejection edge add. Neither uniform over all connected labeled graphs."
    benchmark: true
    benchmark_id: graph_connected_m_eq_n

  - id: graph_gen
    name: Random graph with fixed n, m
    category: graphs
    tgen:
      has: true
      api: "graph(n, m).gen()"
      uniform: uniform
      complexity: "O(n + m log n); rejection with constraint machinery"
    jngen:
      has: true
      api: "Graph::random(n, m)"
      uniform: non-uniform (inferred)
      complexity: "O(n + m) expected (inferred); rejection on random vertex pairs"
    notes: "tgen documents uniform sampling among valid graphs; jngen does not."
    benchmark: true
    benchmark_id: graph_gen

  - id: graph_gen_skewed
    name: Skewed / stretched connected graph
    category: graphs
    tgen:
      has: true
      api: "graph::gen_skewed(n, m, elongation, spread)"
      uniform: non-uniform
      complexity: "O(n + m log n); wnext backbone + ancestor-biased edges"
    jngen:
      has: true
      api: "Graph::randomStretched(n, m, elongation, spread)"
      uniform: non-uniform
      complexity: "O(n + m) expected (inferred); randomPrim backbone + parent-hop edges; may throw after 1000 failures"
    notes: "Both intentionally biased toward high diameter. Parent-hop semantics differ slightly (k in [2, spread] vs up to spread hops)."
    benchmark: true
    benchmark_id: graph_gen_skewed_m_eq_n

  - id: graph_modifiers
    name: Graph modifiers (directed, multi, acyclic, loops)
    category: graphs
    tgen:
      has: true
      api: "graph(...).directed().multi().acyclic()..."
      uniform: varies
      complexity: "Declarative constraint composition"
    jngen:
      has: true
      api: "Graph::random(...).directed().allowMulti().acyclic()..."
      uniform: varies (inferred)
      complexity: "O(n + m) expected (inferred); same as Graph::random with modifier traits"
    notes: "Both support modifier chains; tgen documents uniformity where promised."

  - id: graph_bipartite
    name: Bipartite graph (random / complete)
    category: graphs
    tgen:
      has: true
      api: "graph::gen_bipartite(n1, n2, m), K(n1, n2)"
      uniform: uniform
      complexity: "O(n1 + n2 + m log(n1 + n2)); uniform cross edges"
    jngen:
      has: true
      api: "Graph::randomBipartite(n1, n2, m), completeBipartite(n1, n2)"
      uniform: non-uniform (inferred)
      complexity: "O(n1 + n2 + m) expected (inferred); rejection on random cross edges"
    notes: "Both support random and complete bipartite graphs. tgen documents uniform sampling among valid bipartite graphs with m edges."
    benchmark: true
    benchmark_id: graph_bipartite

  - id: graph_complete_named
    name: Complete and named graphs
    category: graphs
    tgen:
      has: true
      api: "K(n), K(n1,n2), C(n), P(n), S(n) graph helpers"
      uniform: varies
      complexity: "O(n²) edges for cliques; O(n) for path/star/cycle"
    jngen:
      has: true
      api: "Graph::complete(n), completeBipartite(n1, n2)"
      uniform: varies
      complexity: "O(n²) (inferred); deterministic edge lists"
    notes: "tgen exposes more named helpers (cycle, path, star as graphs). completeBipartite is deterministic."

  - id: graph_directed
    name: Directed / acyclic random graph
    category: graphs
    tgen:
      has: true
      api: "graph(n, m, directed=true).gen(), .get_acyclic()"
      uniform: varies
      complexity: "O(n + m log n); same rejection machinery with directed constraints"
    jngen:
      has: true
      api: "Graph::random(n, m).directed().acyclic().g()"
      uniform: non-uniform (inferred)
      complexity: "O(n + m) expected (inferred); rejection + acyclic shuffle when needed"
    notes: "Comparable directed sampling via modifier chains. tgen documents uniformity for some constrained variants."
    benchmark: true
    benchmark_id: graph_directed

  - id: graph_weighted
    name: Weighted graphs and trees
    category: graphs
    tgen:
      has: true
      api: "wgraph / wtree (vertex- and edge-weighted variants)"
      uniform: non-uniform (inferred)
      complexity: "Same generators as unweighted, plus weight assignment"
    jngen:
      has: true
      api: "Graph::setVertexWeights / setEdgeWeight; Tree inherits graph weights"
      uniform: non-uniform (inferred)
      complexity: "O(n + m) (inferred); base generator + weight assignment"

  # --- Trees (benchmarked head-to-head) ---
  - id: tree_gen
    name: Random labeled tree
    category: trees
    tgen:
      has: true
      api: "tree(n).gen()"
      uniform: uniform
      complexity: "O(n); Prüfer sequence"
    jngen:
      has: true
      api: "Tree::random(n)"
      uniform: uniform
      complexity: "O(n); Prüfer sequence"
    notes: "Same Prüfer algorithm. jngen prints sorted edges rooted at 0 by default."
    benchmark: true
    benchmark_id: tree_gen

  - id: tree_rooted_output
    name: Rooted tree output / edge order
    category: trees
    tgen:
      has: true
      api: "tree(n).gen(); stream output with configurable 1-based vertices"
      uniform: ""
      complexity: "O(n) generation; O(n) print"
    jngen:
      has: true
      api: "Tree::random(n); .println() / Repr with printEdges, shuffle"
      uniform: ""
      complexity: "O(n) (inferred)"
    notes: "jngen defaults to sorted edges rooted at vertex 0. tgen uses declarative print helpers and 0-based internal indices."

  - id: tree_gen_skewed
    name: Skewed tree (wnext / Prim-like)
    category: trees
    tgen:
      has: true
      api: "tree::gen_skewed(n, elongation)"
      uniform: non-uniform
      complexity: "O(n); parent(i) = wnext(i, elongation)"
    jngen:
      has: true
      api: "Tree::randomPrim(n, elongation)"
      uniform: non-uniform
      complexity: "O(n); same wnext process"
    notes: "Equivalent algorithms. Large positive elongation → path; large negative → star."
    benchmark: true
    benchmark_id: tree_gen_skewed

  - id: tree_named_shapes
    name: Named tree shapes (star, path, caterpillar, k-ary)
    category: trees
    tgen:
      has: true
      api: "S(n) star, P(n) path; no caterpillar/binary/k-ary"
      uniform: ""
      complexity: "O(n); standard graph helpers (also valid trees)"
    jngen:
      has: true
      api: "Tree::star, bamboo, caterpillar, binary, kary, ..."
      uniform: varies (inferred)
      complexity: "O(n) (inferred)"
    notes: "tgen exposes star and path as graph helpers; jngen has a richer set of named tree generators."

  - id: tree_kruskal
    name: Random tree (Kruskal-like)
    category: trees
    tgen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    jngen:
      has: true
      api: "Tree::randomKruskal(n)"
      uniform: non-uniform
      complexity: "O(n²) expected (inferred); rejection until connected"

  # --- Lists and sequences ---
  - id: list_all_different
    name: Distinct values in range
    category: lists
    tgen:
      has: true
      api: "list<int>(k, lo, hi).all_different().gen()"
      uniform: uniform
      complexity: "O(k log k); Fisher–Yates + forbidden-value map"
    jngen:
      has: true
      api: "Array::randomUnique(k, lo, hi)"
      uniform: uniform
      complexity: "O(k log k) expected (inferred); hash-set rejection"
    notes: "Both produce uniform distinct samples."
    benchmark: true
    benchmark_id: list_all_different

  - id: permutation_uniform
    name: Uniform random permutation
    category: lists
    tgen:
      has: true
      api: "permutation(n).gen()"
      uniform: uniform
      complexity: "O(n)"
    jngen:
      has: true
      api: "Array::id(n).shuffled()"
      uniform: uniform
      complexity: "O(n)"
    benchmark: true
    benchmark_id: permutation_uniform

  - id: structured_output
    name: Pairs, tuples, structured printing
    category: lists
    tgen:
      has: true
      api: "pair(...), list/str/... with << and multi-line tuple layout"
      uniform: varies
      complexity: "O(output size)"
    jngen:
      has: true
      api: "Array / Graph .println(), Repr modifiers (shuffle, reverse, edges)"
      uniform: ""
      complexity: "O(output size) (inferred)"
    notes: "tgen has first-class pair/tuple generators and stream formatting. jngen focuses on testlib-style println helpers."

  - id: declarative_generators
    name: Declarative constraints (sorted, palindrome, cycles)
    category: lists
    tgen:
      has: true
      api: "list/str/permutation/pair with .sorted(), .palindrome(), .cycles()..."
      uniform: varies
      complexity: "Constraint-based uniform sampling where documented"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  # --- Math ---
  - id: math_partition_fixed_size
    name: Ordered partition into k parts (composition)
    category: math
    tgen:
      has: true
      api: "math::gen_partition_fixed_size(n, k, part_left, part_right)"
      uniform: uniform
      complexity: "O(n) stars-and-bars (unbounded parts) or O(n·k) DP with bounds"
    jngen:
      has: true
      api: "rndm.partition(n, numParts, minSize, maxSize)"
      uniform: non-uniform
      complexity: "O(k log k) (inferred); random delimiters, sort, heuristic redistribution"
    notes: "Different algorithms and semantics. tgen returns an ordered composition sampled uniformly. jngen sorts parts in non-increasing order (not a uniform composition); source comments that bounded redistribution 'need a smarter way'."

  - id: math_partition
    name: Ordered partition, variable number of parts
    category: math
    tgen:
      has: true
      api: "math::gen_partition(n, part_left, part_right)"
      uniform: uniform
      complexity: "O(n); DP in log space"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: math_random_prime
    name: Random prime in range
    category: math
    tgen:
      has: true
      api: "math::gen_prime(left, right)"
      uniform: uniform
      complexity: "O(log³ n) expected"
    jngen:
      has: true
      api: "rndm.randomPrime(l, r)"
      uniform: uniform (inferred)
      complexity: "O((r−l) log r) worst case (inferred); Miller–Rabin rejection"
    notes: "tgen documents uniform sampling among primes in the interval."

  - id: math_congruent
    name: Random integer with congruence constraints
    category: math
    tgen:
      has: true
      api: "math::gen_congruent(l, r, rems, mods)"
      uniform: uniform
      complexity: "O(|mods| + log r)"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: math_partition_array
    name: Partition array into k groups
    category: math
    tgen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    jngen:
      has: true
      api: "rndm.partition(elements, numParts, minSize, maxSize)"
      uniform: non-uniform
      complexity: "O(n + k log k) (inferred); shuffle + partition sizes + split"

  # --- Geometry ---
  - id: geometry_convex_polygon
    name: Random convex polygon
    category: geometry
    tgen:
      has: true
      api: "geometry::random_convex_polygon(n, min, max)"
      uniform: non-uniform
      complexity: "O(n log n); Valtr construction filling bounding box"
    jngen:
      has: true
      api: "rndg.convexPolygon(n, min, max)"
      uniform: non-uniform
      complexity: "O(n log n) (inferred); hull of 10n ellipse points, subsample n"
    notes: "Different shape distributions. jngen needs a large coordinate range at high n (hull subsampling); benchmark uses n=3.6e5, max=3e9 for both."
    benchmark: true
    benchmark_id: geometry_convex_polygon
    visualize: true

  - id: geometry_points_general_position
    name: Points in general position (no three collinear)
    category: geometry
    tgen:
      has: true
      api: "geometry::random_points_general_position(n, min, max)"
      uniform: non-uniform
      complexity: "O(n); algebraic construction over F_p"
    jngen:
      has: true
      api: "rndg.pointsInGeneralPosition(n, min, max)"
      uniform: non-uniform (inferred)
      complexity: "O(n² log n) expected (inferred); rejection until no collinearity"
    notes: "Not benchmarked head-to-head: jngen is asymptotically slower."
    benchmark: false
    benchmark_id: geometry_points_general_position
    visualize: true

  - id: geometry_simple_polygon
    name: Random simple polygon
    category: geometry
    tgen:
      has: true
      api: "geometry::random_simple_polygon(n, min, max)"
      uniform: non-uniform
      complexity: "O(n log n) expected; points + polygonization"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    benchmark: false
    benchmark_id: geometry_random_simple_polygon
    visualize: true

  - id: geometry_simple_polygon_through_points
    name: Simple polygon through given points
    category: geometry
    tgen:
      has: true
      api: "geometry::random_simple_polygon_through_points(pts)"
      uniform: non-uniform
      complexity: "O(n log n) expected; randomized divide-and-conquer Hamiltonian path"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    benchmark: false
    benchmark_id: geometry_simple_polygon_through_points
    visualize: true

  - id: geometry_convex_polygon_tgen_n1e6
    name: Random convex polygon at n=1e6 (tgen scale)
    category: geometry
    tgen:
      has: true
      api: "geometry::random_convex_polygon(1e6, min, max)"
      uniform: non-uniform
      complexity: "O(n log n); Valtr construction"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    notes: "jngen convexPolygon needs hull(10n) vertices and large coordinates; practical n is much lower at the same max coordinate."
    benchmark: true
    benchmark_id: geometry_convex_polygon_tgen_n1e6
    exclusive: tgen

  - id: testlib_integration
    name: testlib integration
    category: other
    tgen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    jngen:
      has: true
      api: "registerGen, global rnd/rndm/rndg, testlib-compatible patterns"
      uniform: ""
      complexity: ""
    notes: "jngen is built on testlib. tgen is a standalone header with register_gen and its own constraint API."
    exclusive: jngen

  - id: geometry_svg_drawer
    name: Built-in SVG visualization
    category: other
    tgen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
    jngen:
      has: true
      api: "Drawer d; d.polygon(...); d.dumpSvg(\"out.svg\")"
      uniform: ""
      complexity: "Drawer for points, segments, circles, polygons."

  # --- Strings and hashing ---
  - id: str_regex
    name: Regex / pattern strings
    category: strings
    tgen:
      has: true
      api: 'str("[a-z]{10}").gen()'
      uniform: uniform
      complexity: "O(n); uniform over matches when each string has a unique parse"
    jngen:
      has: true
      api: 'rnd.next("[a-z]{10}") / rnds.random(pattern)'
      uniform: non-uniform
      complexity: "O(output length) (inferred); testlib-compatible pattern generation"
    notes: "Same testlib-style regex syntax. tgen samples uniformly among matches (documented); jngen explicitly does not — e.g. rnd.next(\"[1-9][0-9]{1,2}\") does not yield uniform digit strings."

  - id: anti_hash_strings
    name: Polynomial hash collision strings (signed mod)
    category: strings
    tgen:
      has: true
      api: "hack::polynomial_hash_hack(alphabet, base, mod)"
      uniform: undocumented
      complexity: "Birthday attack; up to 2 (base, mod) pairs"
    jngen:
      has: true
      api: "rnds.antiHash({{mod, base}, ...}, alphabet, len)"
      uniform: undocumented
      complexity: "O(√mod) expected (inferred); brute force over short strings"
    notes: "Deterministic collision construction, not random sampling. Both generate colliding strings for rolling hash."

  - id: hack_unsigned_polynomial_hash
    name: Polynomial hash collision (unsigned / power-of-two mod)
    category: strings
    tgen:
      has: true
      api: "hack::unsigned_polynomial_hash_hack()"
      uniform: ""
      complexity: "O(1); Thue–Morse construction"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  # --- Adversarial / hacks (hack) ---
  - id: anti_unordered_set
    name: std::unordered_set collision inputs
    category: adversarial
    tgen:
      has: true
      api: "hack::std_unordered(size)"
      uniform: ""
      complexity: "GCC multiplier-based collision keys"
    jngen:
      has: true
      api: "rnda.antiUnorderedSet(n, maxLoadFactor, reserve)"
      uniform: ""
      complexity: "GCC 4.x only; tuned load factor/reserve"
    notes: "Overlap in purpose; different APIs and compiler support."

  - id: hack_string_set
    name: std::set collision strings
    category: adversarial
    tgen:
      has: true
      api: "hack::string_set(size)"
      uniform: ""
      complexity: "Distinct strings with equal std::set ordering keys"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_dinitz
    name: Max-flow worst case (Dinitz / Edmonds-Karp)
    category: adversarial
    tgen:
      has: true
      api: "hack::dinitz_worst_case(k, l)"
      uniform: ""
      complexity: "O(k·l) vertices; Zadeh network"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_mo
    name: Mo's algorithm worst-case queries
    category: adversarial
    tgen:
      has: true
      api: "hack::mo(n, q)"
      uniform: ""
      complexity: "O(q) range queries on a path"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_spfa
    name: SPFA TLE graph
    category: adversarial
    tgen:
      has: true
      api: "hack::spfa_hack(n)"
      uniform: ""
      complexity: "O(n) vertices/edges; forces Ω(n²) relaxations"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_stale_heap_dijkstra
    name: Stale-heap Dijkstra bug graph
    category: adversarial
    tgen:
      has: true
      api: "hack::stale_heap_dijkstra_bug(n)"
      uniform: ""
      complexity: "Catches lazy Dijkstra without decrease-key / stale entries"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_non_strict_dijkstra
    name: Non-strict relaxation Dijkstra bug graph
    category: adversarial
    tgen:
      has: true
      api: "hack::non_strict_relaxation_dijkstra_bug(n)"
      uniform: ""
      complexity: "Catches Dijkstra that relaxes on dist[v] == dist[u] + w"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_mt19937_xor_hash
    name: mt19937 XOR-hash collision mask
    category: adversarial
    tgen:
      has: true
      api: "hack::mt19937_xor_hash_hack<T>()"
      uniform: ""
      complexity: "O(1); bitmask for int or long long outputs"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_segment_tree_beats
    name: Segment-tree-beats worst case
    category: adversarial
    tgen:
      has: true
      api: "hack::segment_tree_beats_hack(k, q)"
      uniform: ""
      complexity: "Initial array + q range chmin updates"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""

  - id: hack_rotating_calipers
    name: Rotating calipers bug polygon
    category: adversarial
    tgen:
      has: true
      api: "hack::naive_rotating_calipers_max_dist_bug()"
      uniform: ""
      complexity: "O(1); fixed 6-vertex convex polygon"
    jngen:
      has: false
      api: ""
      uniform: ""
      complexity: ""
